# Runs the Ollama container on an NVIDIA GPU (needs the NVIDIA Container Toolkit; built into Docker Desktop on Windows).
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml --profile ai up --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
